name: Grand Strategy CI

on:
  pull_request:
    paths:
      - "grand-strategy/**"
      - ".github/workflows/grand-strategy-ci.yml"
  push:
    branches:
      - "feature/grand-strategy-layer1"
    paths:
      - "grand-strategy/**"
      - ".github/workflows/grand-strategy-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grand-strategy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
